name: CardScanner
options:
  bundleIdPrefix: com.lin
  deploymentTarget:
    iOS: "16.0"
targets:
  CardScanner:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lin.cardscanner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄卡牌进行识别和查价"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
